sync_google_keep:
  name: Synchronize Google Keep
  description: Fetch fresh Google Keep data and reconcile it with the household shopping list.
  fields:
    config_entry_id:
      name: Household integration
      description: Required when more than one CTR household has Keep synchronization enabled.
      selector:
        config_entry:
          integration: coffey_table_recipes
retire_keep_bridge:
  name: Retire migrated Google Keep bridge
  description: After a fresh verified sync, remove the disabled standalone bridge entry and move its source to a recovery folder. Keep a Home Assistant backup before using this action.
  fields:
    config_entry_id:
      name: Household integration
      required: true
      selector:
        config_entry:
          integration: coffey_table_recipes
