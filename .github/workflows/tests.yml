name: Validate integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pip_audit --progress-spinner off
      - run: python -m unittest discover -s tests -p test_api.py -v
      - run: python -m unittest discover -s tests -p test_keep_engine.py -v
      - run: python -m unittest discover -s tests -p test_keep_adapter.py -v
      - run: python -m pytest tests/test_integration.py tests/test_keep_native.py tests/test_icloud_native.py -v
